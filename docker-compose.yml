
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8123:80"                      
    volumes:
      - ./public:/var/www/html         
      - ./classes:/var/www/classes    
    depends_on:
      - db

  db:
    image: mysql:8.3
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: musculation_db
      MYSQL_USER:   muscu_user
      MYSQL_PASSWORD: muscu_pass
    volumes:
      - db-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d  
    ports:
      - "3407:3306"                     

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
    ports:
      - "8087:80"                       
    depends_on:
      - db

volumes:
  db-data: